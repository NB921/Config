mixed-port: 7890
ipv6: true
allow-lan: true
bind-address: "*"
unified-delay: false
tcp-concurrent: true
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
geodata-mode: true
geox-url:
  geoip: https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat
  geosite: https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb
  asn: https://mirror.ghproxy.com/https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb
find-process-mode: strict
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com
  force-dns-resolve: true
  parse-pure-ip: true
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "*"
    - +.lan
    - +.local
    - +.market.xiaomi.com
  nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query
    geosite:geolocation-!cn:
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
pt: &a2
  type: select
  proxies:
    - 全球代理
    - 自动选择
    - 故障转移
  include-all: true
p: &a1
  type: http
  interval: 3600
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
  filter: ^(?!.*(工单|以下|套餐|回国|国内直连|国际|官网|流量|校园|重置|电信|订阅|80|443|节点名|群组|Baidu))
d: &a3
  type: http
  behavior: classical
  interval: 86400
  format: text
#proxy-providers:
  #养猪场:
    #<<: *a1
    #override:
      #additional-prefix: 【Pig】
    #url: ht2
    #lazy: true
proxy-groups:
  - name: 全球代理
    type: select
    proxies:
      - 故障转移
      - 自动选择
    include-all: true
    icon: https://raw.githubusercontent.com/NB921/picture/main/Golbal.png
    interrupt-exist-connections: false
  - name: 自动选择
    type: url-test
    url: https://cp.cloudflare.com
    include-all: true
    tolerance: 10
    icon: https://raw.githubusercontent.com/NB921/picture/main/Sdxz.png
    interrupt-exist-connections: false
  - name: 故障转移
    type: fallback
    url: https://cp.cloudflare.com
    interval: 300
    include-all: true
    icon: https://raw.githubusercontent.com/NB921/picture/main/Health.png
    interrupt-exist-connections: false
  - name: 油管服务
    <<: *a2
    icon: https://raw.githubusercontent.com/NB921/picture/main/Youtube1.png
    interrupt-exist-connections: false
  - name: 电报服务
    <<: *a2
    icon: https://raw.githubusercontent.com/NB921/picture/main/Telegram.png
    interrupt-exist-connections: false
  - name: X
    <<: *a2
    icon: https://raw.githubusercontent.com/NB921/picture/refs/heads/main/twitter_x.png
    interrupt-exist-connections: false
  - name: 漏网之鱼
    type: select
    proxies:
      - 全球代理
      - DIRECT
    icon: https://raw.githubusercontent.com/NB921/picture/main/Yu.png
    interrupt-exist-connections: false
rule-providers:
  video:
    <<: *a3
    url: https://raw.githubusercontent.com/NB921/rule/main/surge/video.list
    lazy: true
  X:
    <<: *a3
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Twitter/Twitter.list
    lazy: true
  china:
    <<: *a3
    url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/ChinaMax/ChinaMax.yaml
    lazy: true
rules:
  - GEOSITE,category-ads-all,REJECT
  - GEOIP,lan,DIRECT,no-resolve
  - RULE-SET,video,DIRECT
  - RULE-SET,china,DIRECT
  - RULE-SET,X,X
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,全球代理
  - DOMAIN-SUFFIX,googleapis.cn,全球代理
  - DOMAIN-SUFFIX,themoviedb.org,全球代理
  - DOMAIN-SUFFIX,tmdb.org,全球代理
  - GEOSITE,telegram,电报服务
  - GEOIP,telegram,电报服务
  - GEOSITE,github,全球代理
  - GEOSITE,youtube,油管服务
  - GEOSITE,CN,DIRECT
  - GEOSITE,geolocation-!cn,全球代理
  - GEOIP,CN,DIRECT
  - MATCH,漏网之鱼
proxies:
  - name: dns
    type: dns
